<!DOCTYPE html>
<html lang="en" x-data>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Prem — Blog</title>
  <link href="assets/css/tailwind.css" rel="stylesheet" />
  <link href="assets/css/style.css" rel="stylesheet" />
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <script defer src="assets/js/marked.min.js"></script>
  <script defer src="assets/js/blog.js"></script>
</head>
<body class="bg-slate-950 text-slate-200">

  <header class="sticky top-0 backdrop-blur bg-white/3 p-4 border-b border-white/5 flex justify-between items-center">
    <div class="flex items-center gap-3">
      <div class="logo-glow">PM</div>
      <div><div class="font-bold">Prem</div><div class="text-xs text-slate-300">Blog</div></div>
    </div>
    <div class="flex gap-3">
      <a href="index.html" class="navlink">Home</a>
      <input id="searchBox" class="px-3 py-1 rounded bg-white/5 text-slate-200" placeholder="Search posts..." />
    </div>
  </header>

  <main class="max-w-5xl mx-auto p-6">
    <section id="list" class="grid gap-6">
      <!-- posts will render here -->
    </section>

    <section id="postView" class="hidden mt-8 neon-card p-6">
      <button id="backToList" class="btn-outline-sm">← Back</button>
      <div id="postContent" class="mt-4 prose prose-invert max-w-none"></div>
    </section>
  </main>

</body>
</html>
