<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Prem | Full Stack Developer</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/styles.css" />

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#2563eb",
              accent: "#38bdf8",
              surface: "#f8fafc",
              "surface-dark": "#0f172a",
            },
            fontFamily: {
              sans: ['"Inter"', '"Segoe UI"', "system-ui", "sans-serif"],
            },
            boxShadow: {
              glow: "0 25px 65px -35px rgba(37, 99, 235, 0.65)",
            },
          },
        },
      };
    </script>
  </head>

  <body
    class="bg-surface text-slate-900 transition-colors duration-300 dark:bg-surface-dark dark:text-slate-100"
  >
    <div class="min-h-screen flex flex-col">
      <header class="w-full">
        <div
          class="mx-auto flex w-full max-w-5xl items-center justify-between px-6 py-8"
        >
          <div>
            <p class="text-xs uppercase tracking-[0.2em] text-primary/70">
              Full Stack Developer
            </p>
            <h1 class="text-2xl font-semibold md:text-3xl">Prem</h1>
          </div>
          <button
            type="button"
            data-theme-toggle
            class="inline-flex items-center gap-2 rounded-full border border-slate-200 bg-white px-5 py-2 text-sm font-semibold text-slate-700 shadow-sm transition hover:-translate-y-0.5 hover:shadow-glow dark:border-slate-700 dark:bg-slate-900 dark:text-slate-100"
          >
            <span data-theme-label>🌙 Dark Mode</span>
          </button>
        </div>
      </header>

      <main class="flex-1">
        <section
          class="fade-in mx-auto w-full max-w-5xl px-6 py-12 text-center sm:py-16"
        >
          <div class="profile-ring mb-8">
            <div
              class="flex h-36 w-36 items-center justify-center rounded-full bg-white text-2xl font-semibold text-primary dark:bg-slate-900"
            >
              <img src="assets/images/19911989.jpg" alt="Prem" class="w-full h-full object-cover rounded-full">
            </div>
        </section>

        <section class="mx-auto w-full max-w-5xl px-6 py-12">
          <div class="text-center">
            <p class="text-sm uppercase tracking-[0.5em] text-primary/70">
              🚀 Selected Work
            </p>
            <h3 class="mt-3 text-3xl font-semibold">My Projects</h3>
            <p class="mx-auto mt-3 max-w-2xl text-sm text-slate-500 dark:text-slate-300">
              A snapshot of products, experiments, and learning playgrounds that
              keep me curious.
            </p>
          </div>

          <div
            id="projectsGrid"
            class="mt-10 grid gap-6 sm:grid-cols-2 lg:grid-cols-3"
          ></div>
        </section>
      </main>

      <footer
        class="border-t border-slate-200 px-6 py-8 text-center text-sm text-slate-500 dark:border-slate-800 dark:text-slate-400"
      >
        Made with ❤️ by Prem •
        <a
          href="https://github.com/sameer05515"
          class="font-semibold text-primary hover:text-accent focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-accent"
          target="_blank"
          rel="noreferrer"
        >
          GitHub Profile
        </a>
      </footer>
    </div>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
